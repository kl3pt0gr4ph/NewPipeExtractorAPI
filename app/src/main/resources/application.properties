# NewPipeExtractorAPI settings
#
# Every setting the API reads, with its default and environment variable. The
# README's Configuration section has the same list as a table.
#
# Any property can be set as an environment variable: upper-case it, turn dots
# into underscores and drop dashes, e.g. opentube.http.read-timeout becomes
# OPENTUBE_HTTP_READTIMEOUT. Environment variables win over this file.
#
# Commented-out lines show a default that lives in code; uncomment one only to
# change it. Uncommented lines replace one of Spring Boot's defaults.
#
# Durations take Spring's format: 500ms, 30s, 10m, 6h.
# The dev profile (application-dev.properties) changes a few of these for
# development.

# ── Server ──────────────────────────────────────────────────────────────────

# SERVER_PORT: port the API listens on. The Docker image's HEALTHCHECK follows it.
#server.port=8080

# SPRING_PROFILES_ACTIVE: "dev" for development settings. It's the only profile.
#spring.profiles.active=


# ── Logging ─────────────────────────────────────────────────────────────────

# LOGGING_LEVEL_ROOT
#logging.level.root=INFO

# LOGGING_LEVEL_ORG_EXAMPLE_API: the API's own packages. Follows the root level
# unless set; DEBUG in the dev profile.
#logging.level.org.example.api=INFO

# LOGGING_LEVEL_ORG_SCHABI_NEWPIPE: NewPipeExtractor
logging.level.org.schabi.newpipe=WARN

# LOGGING_PATTERN_CONSOLE: requestId and resourceId come from MDCFilter
logging.pattern.console=%d{HH:mm:ss:SSS} %-5level %X{requestId:-} %X{resourceId:-} %logger{36} - %msg%n


# ── Stream info cache (StreamInfoCacheProperties) ───────────────────────────

# OPENTUBE_CACHE_STREAMINFO_MAXENTRIES: maximum cached videos
#opentube.cache.streaminfo.max-entries=300

# OPENTUBE_CACHE_STREAMINFO_SAFETYMARGIN: how long before the stream URLs expire an entry is dropped
#opentube.cache.streaminfo.safety-margin=10m

# OPENTUBE_CACHE_STREAMINFO_FALLBACKTTL: lifetime when no expire timestamp is found
#opentube.cache.streaminfo.fallback-ttl=5m

# OPENTUBE_CACHE_STREAMINFO_DEGRADEDTTL: lifetime of an extraction with no adaptive streams
#opentube.cache.streaminfo.degraded-ttl=30s

# OPENTUBE_CACHE_STREAMINFO_MAXTTL: upper bound on any entry's lifetime
#opentube.cache.streaminfo.max-ttl=6h


# ── Extraction (ExtractionProperties) ───────────────────────────────────────

# OPENTUBE_EXTRACTION_ATTEMPTS: total extractions of a video when YouTube returns
# no adaptive streams. 1 turns retrying off. 1-5.
#opentube.extraction.attempts=2


# ── NewPipeExtractor (NewPipeProperties) ────────────────────────────────────

# OPENTUBE_NEWPIPE_LANGUAGE: lower-case ISO 639 code for the language of titles,
# descriptions, dates and counts
#opentube.newpipe.language=en

# OPENTUBE_NEWPIPE_COUNTRY: upper-case ISO 3166 code for the region of kiosks and search
#opentube.newpipe.country=GB


# ── HTTP client to YouTube (HttpClientProperties) ───────────────────────────

# OPENTUBE_HTTP_CONNECTTIMEOUT: must be positive
#opentube.http.connect-timeout=30s

# OPENTUBE_HTTP_READTIMEOUT: must be positive
#opentube.http.read-timeout=30s

# OPENTUBE_HTTP_USERAGENT: sent unless NewPipeExtractor sets its own. Defaults to
# the current Firefox ESR; see HttpClientProperties.DEFAULT_USER_AGENT.
#opentube.http.user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:140.0) Gecko/20100101 Firefox/140.0


# ── CORS on /api/** (CorsProperties) ────────────────────────────────────────

# OPENTUBE_CORS_ALLOWEDORIGINS: * or a list of origins, e.g. https://opentube.example
#opentube.cors.allowed-origins=*

# OPENTUBE_CORS_ALLOWEDMETHODS
#opentube.cors.allowed-methods=GET,OPTIONS


# ── Responses ───────────────────────────────────────────────────────────────

# SPRING_JACKSON_SERIALIZATION_INDENTOUTPUT: pretty-print JSON. On in the dev profile.
#spring.jackson.serialization.indent-output=false

# OPENTUBE_ERRORS_INCLUDEDETAIL: add a "detail" field with the underlying exception
# chain (e.g. NewPipeExtractor's own message) to error responses. On in the dev
# profile. Development only: it exposes internals.
#opentube.errors.include-detail=false


# ── Health (Spring Boot Actuator) ───────────────────────────────────────────

# Only /actuator/health is exposed.
management.endpoints.web.exposure.include=health

# MANAGEMENT_ENDPOINT_HEALTH_SHOWDETAILS: never, when-authorized or always.
# always in the dev profile.
#management.endpoint.health.show-details=never


# ── API docs (springdoc) ────────────────────────────────────────────────────
# Spec:       /v3/api-docs (JSON), /v3/api-docs.yaml (YAML)
# Swagger UI: /swagger-ui.html

# SPRINGDOC_APIDOCS_ENABLED: false turns off the spec and Swagger UI
#springdoc.api-docs.enabled=true

# SPRINGDOC_SWAGGERUI_ENABLED: false keeps the spec and drops only the UI
#springdoc.swagger-ui.enabled=true

# OPENTUBE_OPENAPI_SERVERURL: public base URL for the spec's "servers" list, e.g.
# when the API is behind a reverse proxy. Unset, the spec uses the URL each
# request arrives on.
#opentube.openapi.server-url=https://api.opentube.example

# Fixed: how the spec and UI are generated
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.paths-to-match=/api/**
springdoc.writer-with-order-by-keys=true
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.filter=true


# ── JVM ─────────────────────────────────────────────────────────────────────
# JDK_JAVA_OPTIONS: extra JVM flags, set as an env var only. They take precedence
# over the Docker image's defaults in JAVA_TOOL_OPTIONS.
