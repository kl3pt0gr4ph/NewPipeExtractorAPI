# Logging Configuration
logging.level.root=INFO
logging.level.org.example.api=INFO
logging.level.org.schabi.newpipe=WARN

logging.pattern.console=%d{HH:mm:ss:SSS} %-5level %X{requestId:-} %X{resourceId:-} %logger{36} - %msg%n

# Jackson Configuration
spring.jackson.serialization.indent-output=true

# Expose health endpoint
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# OpenAPI / Swagger UI Configuration
# Spec:       /v3/api-docs (JSON), /v3/api-docs.yaml (YAML)
# Swagger UI: /swagger-ui.html
# Set SPRINGDOC_APIDOCS_ENABLED=false to turn off both the spec and the UI,
# or SPRINGDOC_SWAGGERUI_ENABLED=false to keep the spec and drop only the UI.
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

springdoc.paths-to-match=/api/**
springdoc.writer-with-order-by-keys=true

springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.filter=true

# Public base URL written into the spec's "servers" list, e.g. when the API is
# behind a reverse proxy. Leave unset to use the URL each request arrives on.
# opentube.openapi.server-url=https://api.opentube.com