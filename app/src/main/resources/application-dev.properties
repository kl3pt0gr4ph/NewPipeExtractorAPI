# Development: activate with SPRING_PROFILES_ACTIVE=dev, or
#   mvn spring-boot:run -Dspring-boot.run.profiles=dev
#
# Settings that make development easier and expose internals. Never use this
# profile anywhere users can reach the API. To turn one of these on in another
# environment, set its env var instead (see application.properties).

# LOGGING_LEVEL_ORG_EXAMPLE_API
logging.level.org.example.api=DEBUG

# SPRING_JACKSON_SERIALIZATION_INDENTOUTPUT
spring.jackson.serialization.indent-output=true

# MANAGEMENT_ENDPOINT_HEALTH_SHOWDETAILS
management.endpoint.health.show-details=always

# OPENTUBE_ERRORS_INCLUDEDETAIL
opentube.errors.include-detail=true
