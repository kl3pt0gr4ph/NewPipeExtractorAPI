version: 2
updates:
  - package-ecosystem: 'maven'
    directory: '/app'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(dev-deps)'
    labels: ['dependencies', 'maven']
    cooldown:
      default-days: 3
      semver-major-days: 14
    groups:
      spring-boot:
        patterns:
          - 'org.springframework.boot:*'
      newpipe-extractor:
        patterns:
          - 'com.github.teamnewpipe:*'
      okhttp:
        patterns:
          - 'com.squareup.okhttp3:*'
      build-plugins:
        patterns:
          - 'org.jacoco:*'
          - 'org.apache.maven.plugins:*'
      minor-and-patch:
        update-types: ['minor', 'patch']

  - package-ecosystem: 'docker'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'chore(docker)'
    labels: ['dependencies', 'docker']
    ignore:
      - dependency-name: 'eclipse-temurin'
        update-types: ['version-update:semver-major']
      - dependency-name: 'maven'
        update-types: ['version-update:semver-major']

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    commit-message:
      prefix: 'chore(ci)'
    labels: ['dependencies', 'ci']
    groups:
      actions:
        patterns: ['*']